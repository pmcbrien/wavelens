<text x='435' y='355' font-size='10' font-weight='600' fill='#b91c1c' text-anchor='start'>USB-C 5 V / 3 A</text>
<rect x='345' y='400' width='160' height='56' rx='8' fill='#fef2f2' stroke='#b91c1c' stroke-width='1.5'/>
<text x='357' y='422' font-size='13' font-weight='700' fill='#b91c1c' text-anchor='start'>12 V → 5 V 3 A buck</text>
<text x='357' y='440' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>fused from the accessory circuit</text>
<rect x='40' y='400' width='260' height='150' rx='8' fill='#ffffff' stroke='#1f2933' stroke-width='1.5'/>
<text x='52' y='422' font-size='13' font-weight='700' fill='#1f2933' text-anchor='start'>Data flow on the Pi</text>
<text x='52' y='440' font-size='10' font-weight='700' fill='#1d4ed8' text-anchor='start' font-family='ui-monospace, Menlo, Consolas, monospace'>rtl_433 -F json</text>
<text x='170' y='440' font-size='10' font-weight='400' fill='#6b7280' text-anchor='start'>sub-GHz frames → JSON</text>
<line x1='90' y1='445' x2='90' y2='454' stroke='#9aa5b1' stroke-width='1' marker-end='url(#arr)'/>
<text x='52' y='464' font-size='10' font-weight='700' fill='#1d4ed8' text-anchor='start' font-family='ui-monospace, Menlo, Consolas, monospace'>kismet → devices.json</text>
<text x='170' y='464' font-size='10' font-weight='400' fill='#6b7280' text-anchor='start'>Wi-Fi APs, monitor adapter</text>
<line x1='90' y1='469' x2='90' y2='478' stroke='#9aa5b1' stroke-width='1' marker-end='url(#arr)'/>
<text x='52' y='488' font-size='10' font-weight='700' fill='#1d4ed8' text-anchor='start' font-family='ui-monospace, Menlo, Consolas, monospace'>wavelens_bridge.py</text>
<text x='170' y='488' font-size='10' font-weight='400' fill='#6b7280' text-anchor='start'>Wavelens lines + cat/conf</text>
<line x1='90' y1='493' x2='90' y2='502' stroke='#9aa5b1' stroke-width='1' marker-end='url(#arr)'/>
<text x='52' y='512' font-size='10' font-weight='700' fill='#1d4ed8' text-anchor='start' font-family='ui-monospace, Menlo, Consolas, monospace'>BlueZ GATT peripheral</text>
<text x='170' y='512' font-size='10' font-weight='400' fill='#6b7280' text-anchor='start'>notify, 180-byte chunks</text>
<rect x='540' y='330' width='420' height='184' rx='6' fill='#f3f4f6' stroke='#9aa5b1' stroke-width='1'/>
<text x='550' y='348' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Why this build</text>
<text x='550' y='362' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'></text>
<text x='550' y='376' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• Sub-GHz is where TPMS, key fobs, wireless sensors and LoRa live;</text>
<text x='550' y='390' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  no phone hears any of it.</text>
<text x='550' y='404' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• Kismet on a monitor-mode adapter sees every channel it is parked</text>
<text x='550' y='418' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  on, including 5 GHz hidden-SSID hotspots, with no OS throttling.</text>
<text x='550' y='432' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• A HackRF (1 MHz–6 GHz) on another port adds hackrf_sweep: energy</text>
<text x='550' y='446' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  peaks in the 900 MHz, 1.2 GHz, 2.4 GHz and 5.8 GHz bands.</text>
<text x='550' y='460' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• The bridge does not classify beyond a hint; the app&#39;s signature</text>
<text x='550' y='474' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  pack still has the last word.</text>
<text x='550' y='488' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• Antennas: a log-periodic covers 400–1000 MHz in one unit; a</text>
<text x='550' y='502' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  2.4/5 GHz panel for the Wi-Fi adapter. Point both forward.</text>
</svg>