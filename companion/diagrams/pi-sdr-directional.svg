<rect width='980' height='640' fill='#ffffff'/>
<text x='24' y='34' font-size='20' font-weight='700' fill='#1f2933'>Raspberry Pi + RTL-SDR with directional antennas</text>
<text x='24' y='56' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>The Pi runs rtl_433 (sub-GHz decoders) and optionally Kismet (monitor-mode Wi-Fi);</text>
<text x='24' y='72' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>wavelens_bridge.py relays both to the phone over the Pi&#39;s own Bluetooth.</text>
