<rect x='660' y='440' width='210' height='52' rx='8' fill='#ffffff' stroke='#1f2933' stroke-width='1.5'/>
<text x='672' y='462' font-size='13' font-weight='700' fill='#1f2933' text-anchor='start'>Mini PC / NUC / Pi 5 (trunk)</text>
<text x='672' y='480' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Linux · rtl_433 · Kismet · bridge</text>
<line x1='660' y1='466' x2='546' y2='372' stroke='#7c3aed' stroke-width='1.5' stroke-dasharray='4,3' marker-end='url(#arrb)'/>
<text x='600' y='440' font-size='10' font-weight='600' fill='#7c3aed' text-anchor='middle'>BLE</text>
<path d='M765,492 L765,540' fill='none' stroke='#9aa5b1' stroke-width='1.5'/>
<rect x='620' y='540' width='290' height='60' rx='8' fill='#eff6ff' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='632' y='562' font-size='13' font-weight='700' fill='#1d4ed8' text-anchor='start'>USB hub (powered)</text>
<text x='632' y='580' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>RTL-SDR ×2 (433 + 915 MHz) · HackRF (optional)</text>
<text x='632' y='594' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>USB Wi-Fi monitor adapter · BLE 5 dongle</text>
<rect x='620' y='612' width='290' height='44' rx='8' fill='#fef2f2' stroke='#b91c1c' stroke-width='1.5'/>
