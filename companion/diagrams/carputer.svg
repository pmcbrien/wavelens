<line x1='436.0' y1='278.5' x2='436.0' y2='305.5' stroke='#1d4ed8' stroke-width='3'/>
<line x1='443.2' y1='280.3' x2='443.2' y2='303.7' stroke='#1d4ed8' stroke-width='3'/>
<line x1='450.4' y1='281.65' x2='450.4' y2='302.35' stroke='#1d4ed8' stroke-width='3'/>
<line x1='457.6' y1='283.0' x2='457.6' y2='301.0' stroke='#1d4ed8' stroke-width='3'/>
<line x1='464.8' y1='283.9' x2='464.8' y2='300.1' stroke='#1d4ed8' stroke-width='3'/>
<line x1='472.0' y1='284.8' x2='472.0' y2='299.2' stroke='#1d4ed8' stroke-width='3'/>
<text x='470' y='274' font-size='10' font-weight='600' fill='#1d4ed8' text-anchor='middle'>400–1000 MHz LPDA</text>
<line x1='505' y1='316' x2='505' y2='284' stroke='#1f2933' stroke-width='3'/>
<circle cx='505' cy='280' r='5' fill='#1f2933'/>
