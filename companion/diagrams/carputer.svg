<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 680' width='980' height='680' font-family='Inter, Helvetica, Arial, sans-serif'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#9aa5b1'/></marker><marker id='arrb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#7c3aed'/></marker><marker id='arrr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#b45309'/></marker><marker id='arrp' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#b91c1c'/></marker><marker id='arrd' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1d4ed8'/></marker></defs>
<rect width='980' height='680' fill='#ffffff'/>
<text x='24' y='34' font-size='20' font-weight='700' fill='#1f2933'>Carputer: a Linux box, an antenna farm, one bridge</text>
<text x='24' y='56' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>Same software as the Pi build, on whatever runs Linux in the car — a mini PC under the seat,</text>
<text x='24' y='72' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>an Intel NUC, a Pi 5 in a case. Scales by USB port.</text>
<rect x='24' y='92' width='300' height='170' rx='6' fill='#f3f4f6' stroke='#9aa5b1' stroke-width='1'/>
<text x='34' y='110' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>When a carputer makes sense</text>
<text x='34' y='124' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'></text>
<text x='34' y='138' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• Two or more SDRs: one parked on 315/433 MHz for</text>
<text x='34' y='152' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  TPMS and remotes, one on 915 MHz for LoRa / ISM.</text>
<text x='34' y='166' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• A monitor-mode adapter parked on the 5 GHz channel</text>
<text x='34' y='180' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  a body-cam hotspot uses — every beacon, no throttling.</text>
<text x='34' y='194' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• A HackRF for hackrf_sweep: 1 MHz–6 GHz energy peaks.</text>
<text x='34' y='208' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• Logging raw captures locally (never to the phone).</text>
<text x='34' y='222' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'></text>
<text x='34' y='236' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Only want Wi-Fi + BLE with a better antenna? The ESP32</text>
<text x='34' y='250' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>build is a tenth of the effort.</text>
<rect x='656' y='92' width='300' height='142' rx='6' fill='#f3f4f6' stroke='#9aa5b1' stroke-width='1'/>
<text x='666' y='110' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Mounting and RF hygiene</text>
<text x='666' y='124' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'></text>
<text x='666' y='138' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• Antennas forward, on the roof, with a ground plane</text>
<text x='666' y='152' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  (the roof is one). Keep them 20 cm+ apart.</text>
<text x='666' y='166' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• Short coax: every 3 m of RG-58 at 2.4 GHz costs ~3 dB,</text>
<text x='666' y='180' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  which cancels a cheap Yagi&#39;s gain.</text>
<text x='666' y='194' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• A 433 MHz LPDA is big; a 915 MHz one is about 30 cm.</text>
<text x='666' y='208' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>• Fuse the DC-DC. Ignition-switched so it never flattens</text>
<text x='666' y='222' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>  the battery.</text>
<rect x='300' y='316' width='220' height='14' rx='3' fill='#cbd5e1' stroke='#1f2933'/>
<text x='410' y='348' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>mag-mount / NMO plate with bulkhead SMAs</text>
<line x1='306' y1='290' x2='351.0' y2='290' stroke='#b45309' stroke-width='3'/>
<line x1='306.0' y1='275.0' x2='306.0' y2='305.0' stroke='#b45309' stroke-width='3'/>
<line x1='314.0' y1='277.0' x2='314.0' y2='303.0' stroke='#b45309' stroke-width='3'/>
<line x1='322.0' y1='278.5' x2='322.0' y2='301.5' stroke='#b45309' stroke-width='3'/>
