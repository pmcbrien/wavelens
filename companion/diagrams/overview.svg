<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 980 600' width='980' height='600' font-family='Inter, Helvetica, Arial, sans-serif'>
<defs><marker id='arr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#9aa5b1'/></marker><marker id='arrb' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#7c3aed'/></marker><marker id='arrr' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#b45309'/></marker><marker id='arrp' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#b91c1c'/></marker><marker id='arrd' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='7' markerHeight='7' orient='auto-start-reverse'><path d='M0,0 L10,5 L0,10 z' fill='#1d4ed8'/></marker></defs>
<rect width='980' height='600' fill='#ffffff'/>
<text x='24' y='34' font-size='20' font-weight='700' fill='#1f2933'>Wavelens companion radios — how they connect</text>
<text x='24' y='56' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>Every companion is a BLE peripheral speaking one line protocol. The phone is the central; what it hears goes</text>
<text x='24' y='72' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>through the app&#39;s own signatures, alerts, history and map, and the phone can tell it where to listen.</text>
<rect x='60' y='120' width='92' height='170' rx='12' fill='#ecfdf5' stroke='#0f766e' stroke-width='2'/>
<rect x='68' y='134' width='76' height='132' rx='4' fill='#ffffff' stroke='#0f766e' stroke-width='1'/>
<rect x='74' y='142' width='64' height='10' rx='2' fill='#0f766e' fill-opacity='0.5'/>
<rect x='74' y='160' width='64' height='18' rx='2' fill='#0f766e' fill-opacity='0.12'/>
<rect x='74' y='184' width='64' height='18' rx='2' fill='#0f766e' fill-opacity='0.16999999999999998'/>
<rect x='74' y='208' width='64' height='18' rx='2' fill='#0f766e' fill-opacity='0.22'/>
<rect x='74' y='232' width='64' height='18' rx='2' fill='#0f766e' fill-opacity='0.27'/>
<text x='106' y='310' font-size='12' font-weight='700' fill='#0f766e' text-anchor='middle'>Phone · Wavelens</text>
<text x='106' y='326' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>central</text>
<text x='106' y='339' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>no network permission</text>
<text x='106' y='352' font-size='10' font-weight='400' fill='#6b7280' text-anchor='middle'>classifies, alerts, maps</text>
<line x1='170' y1='205' x2='300' y2='205' stroke='#7c3aed' stroke-width='1.6' marker-end='url(#arrb)' marker-start='url(#arrb)'/>
<text x='235' y='192' font-size='11' font-weight='600' fill='#7c3aed' text-anchor='middle'>BLE GATT · notify ↑ / write ↓</text>
<text x='235' y='222' font-size='10' font-weight='400' fill='#7c3aed' text-anchor='middle'>one JSON line per hit</text>
<text x='235' y='235' font-size='10' font-weight='400' fill='#7c3aed' text-anchor='middle'>band / channel commands back</text>
<rect x='310' y='90' width='300' height='96' rx='8' fill='#f8fafc' stroke='#b45309' stroke-width='1.5'/>
<text x='322' y='112' font-size='13' font-weight='700' fill='#b45309' text-anchor='start'>ESP32 (S3 / C3 / classic, -U = u.FL antenna)</text>
<text x='322' y='130' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>hears: 2.4 GHz Wi-Fi beacons, BLE adverts</text>
<text x='322' y='144' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>optional: RX5808 → 5.8 GHz video carriers</text>
<text x='322' y='158' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>honours: park on channels 1·6·11, mode wifi/ble</text>
<line x1='650' y1='138' x2='731.0' y2='138' stroke='#b45309' stroke-width='3'/>
<line x1='650.0' y1='111.0' x2='650.0' y2='165.0' stroke='#b45309' stroke-width='3'/>
<line x1='664.4' y1='114.6' x2='664.4' y2='161.4' stroke='#b45309' stroke-width='3'/>
<line x1='678.8' y1='117.3' x2='678.8' y2='158.7' stroke='#b45309' stroke-width='3'/>
<line x1='693.2' y1='120.0' x2='693.2' y2='156.0' stroke='#b45309' stroke-width='3'/>
<line x1='707.6' y1='121.8' x2='707.6' y2='154.2' stroke='#b45309' stroke-width='3'/>
<line x1='722.0' y1='123.6' x2='722.0' y2='152.4' stroke='#b45309' stroke-width='3'/>
<text x='690.5' y='179.4' font-size='11' font-weight='600' fill='#b45309' text-anchor='middle'>2.4 GHz Yagi / panel</text>
<line x1='610' y1='138' x2='648' y2='138' stroke='#b45309' stroke-width='2' marker-end='url(#arrr)'/>
<rect x='310' y='210' width='300' height='96' rx='8' fill='#f8fafc' stroke='#1d4ed8' stroke-width='1.5'/>
<text x='322' y='232' font-size='13' font-weight='700' fill='#1d4ed8' text-anchor='start'>Raspberry Pi + RTL-SDR</text>
<text x='322' y='250' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>hears: 315 / 433 / 915 MHz via rtl_433 (TPMS, remotes)</text>
<text x='322' y='264' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>+ monitor-mode USB Wi-Fi via Kismet</text>
<text x='322' y='278' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>relays what the tools decode; no parking</text>
<line x1='650' y1='258' x2='731.0' y2='258' stroke='#1d4ed8' stroke-width='3'/>
<line x1='650.0' y1='231.0' x2='650.0' y2='285.0' stroke='#1d4ed8' stroke-width='3'/>
<line x1='664.4' y1='234.6' x2='664.4' y2='281.4' stroke='#1d4ed8' stroke-width='3'/>
<line x1='678.8' y1='237.3' x2='678.8' y2='278.7' stroke='#1d4ed8' stroke-width='3'/>
<line x1='693.2' y1='240.0' x2='693.2' y2='276.0' stroke='#1d4ed8' stroke-width='3'/>
<line x1='707.6' y1='241.8' x2='707.6' y2='274.2' stroke='#1d4ed8' stroke-width='3'/>
<line x1='722.0' y1='243.6' x2='722.0' y2='272.4' stroke='#1d4ed8' stroke-width='3'/>
<text x='690.5' y='299.4' font-size='11' font-weight='600' fill='#1d4ed8' text-anchor='middle'>log-periodic 400–1000 MHz</text>
<line x1='610' y1='258' x2='648' y2='258' stroke='#1d4ed8' stroke-width='2' marker-end='url(#arrd)'/>
<rect x='310' y='330' width='300' height='96' rx='8' fill='#f8fafc' stroke='#1f2933' stroke-width='1.5'/>
<text x='322' y='352' font-size='13' font-weight='700' fill='#1f2933' text-anchor='start'>Carputer (any Linux box, trunk or under seat)</text>
<text x='322' y='370' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>same bridge script as the Pi</text>
<text x='322' y='384' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>as many SDRs and Wi-Fi adapters as USB ports</text>
<text x='322' y='398' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>12 V → DC-DC; BLE dongle if no built-in radio</text>
<rect x='660' y='350' width='70' height='56' rx='4' fill='#fff7ed' stroke='#1f2933' stroke-width='2'/>
<rect x='674.0' y='361.2' width='42.0' height='33.6' rx='3' fill='none' stroke='#1f2933' stroke-width='1.2'/>
<text x='695.0' y='422' font-size='11' font-weight='600' fill='#1f2933' text-anchor='middle'>roof antenna farm</text>
<line x1='610' y1='378' x2='658' y2='378' stroke='#1f2933' stroke-width='2' marker-end='url(#arr)'/>
<rect x='310' y='450' width='300' height='96' rx='8' fill='#f9fafb' stroke='#6b7280' stroke-width='1.5'/>
<text x='322' y='472' font-size='13' font-weight='700' fill='#6b7280' text-anchor='start'>Arduino (not recommended)</text>
<text x='322' y='490' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>needs an HM-10 for BLE and a radio module</text>
<text x='322' y='504' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>an ESP32 does both, for less, with Wi-Fi</text>
<text x='322' y='518' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>shown for completeness in arduino.svg</text>
<rect x='660' y='470' width='70' height='56' rx='4' fill='#fff7ed' stroke='#6b7280' stroke-width='2'/>
<rect x='674.0' y='481.2' width='42.0' height='33.6' rx='3' fill='none' stroke='#6b7280' stroke-width='1.2'/>
<text x='695.0' y='542' font-size='11' font-weight='600' fill='#6b7280' text-anchor='middle'>5.8 GHz patch</text>
<line x1='610' y1='498' x2='658' y2='498' stroke='#6b7280' stroke-width='2' marker-end='url(#arr)'/>
<path d='M300,138 L300,498' fill='none' stroke='#7c3aed' stroke-width='1.2'/>
<path d='M300,138 L310,138' fill='none' stroke='#7c3aed' stroke-width='1.2'/>
<path d='M300,258 L310,258' fill='none' stroke='#7c3aed' stroke-width='1.2'/>
<path d='M300,378 L310,378' fill='none' stroke='#7c3aed' stroke-width='1.2'/>
<path d='M300,498 L310,498' fill='none' stroke='#7c3aed' stroke-width='1.2'/>
<rect x='770' y='100' width='200' height='142' rx='6' fill='#f3f4f6' stroke='#9aa5b1' stroke-width='1'/>
<text x='780' y='118' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Which to build</text>
<text x='780' y='132' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'></text>
<text x='780' y='146' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Wi-Fi hotspots + BLE: ESP32.</text>
<text x='780' y='160' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Sub-GHz (TPMS, remotes): Pi + SDR.</text>
<text x='780' y='174' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>Everything at once: carputer.</text>
<text x='780' y='188' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'></text>
<text x='780' y='202' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>All of them: the antenna is</text>
<text x='780' y='216' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>the upgrade; the board is</text>
<text x='780' y='230' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>just a radio with a plug.</text>
<rect x='770' y='290' width='200' height='100' rx='6' fill='#f3f4f6' stroke='#9aa5b1' stroke-width='1'/>
<text x='780' y='308' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>What none of them fix</text>
<text x='780' y='322' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'></text>
<text x='780' y='336' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>A directional antenna adds</text>
<text x='780' y='350' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>gain forward and loses it to</text>
<text x='780' y='364' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>the sides. It does not keep an</text>
<text x='780' y='378' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>oncoming car in range longer.</text>
<text x='24' y='585' font-size='11' font-weight='400' fill='#6b7280' text-anchor='start'>companion/README.md has the protocol; the app pairs automatically under More → Companion radio.</text>
</svg>