<rect width='1000' height='720' fill='#ffffff'/>
<text x='24' y='34' font-size='20' font-weight='700' fill='#1f2933'>Raspberry Pi + HackRF + two RTL-SDRs</text>
<text x='24' y='56' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>One Pi, three receivers on a powered hub: RTL-SDR A decodes, RTL-SDR B sweeps below 1.7 GHz,</text>
<text x='24' y='72' font-size='12' font-weight='400' fill='#6b7280' text-anchor='start'>the HackRF sweeps the whole 1 MHz–6 GHz range. wavelens_bridge.py sends all of it to the phone over BLE.</text>
