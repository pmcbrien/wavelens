; PlatformIO build for the Wavelens ESP32 companion.
; Arduino IDE works for the base sketch (NimBLE-Arduino 2.x only). The sub-GHz option needs
; the build flags below, so it is a PlatformIO build.

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=0

; ESP32-S3 + SX1276 (e.g. a LoRa32 / Heltec-style board) with rtl_433 decoders on 433.92 MHz.
[env:esp32s3-subghz]
extends = env:esp32s3
lib_deps =
    ${env:esp32s3.lib_deps}
    https://github.com/NorthernMan54/rtl_433_ESP.git
    jgromes/RadioLib@^6.6.0
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    ${env:esp32s3.build_flags}
    -DHAS_SUBGHZ
    -DSUBGHZ_MHZ=433.92
    -DRF_SX1276
    -DRF_MODULE_RECEIVER_GPIO=32       ; DIO2 on the SX1276 → this ESP32 pin
    -DRF_MODULE_CS=18
    -DRF_MODULE_DIO0=26
    -DRF_MODULE_RST=14
    -DRF_MODULE_DIO1=35
    -DRF_MODULE_SCK=5
    -DRF_MODULE_MISO=19
    -DRF_MODULE_MOSI=27
    -DONBOARD_LED=25
    -DRTL_DEBUG=0

; Same with a CC1101: swap the flags.
[env:esp32s3-cc1101]
extends = env:esp32s3-subghz
build_flags =
    ${env:esp32s3.build_flags}
    -DHAS_SUBGHZ
    -DSUBGHZ_MHZ=433.92
    -DRF_CC1101
    -DRF_MODULE_RECEIVER_GPIO=4        ; GDO2
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=2
    -DRF_MODULE_SCK=18
    -DRF_MODULE_MISO=19
    -DRF_MODULE_MOSI=23
    -DRTL_DEBUG=0
