; PlatformIO build for the Wavelens ESP32 companion.
; The sketch sits next to this file (Arduino-IDE layout), not in src/: tell PlatformIO where it is.
[platformio]
src_dir = .
default_envs = esp32
; Arduino IDE works for the base sketch (NimBLE-Arduino 2.x only). The sub-GHz option needs
; the build flags below, so it is a PlatformIO build.

; Plain ESP32 (WROOM-32 dev board), no radio modules: the Wi-Fi + BLE sniffer. Start here.
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Wi-Fi + NimBLE together are ~1.4 MB; the default partition table allows 1.25 MB for the app.
; min_spiffs gives two 1.9 MB app slots on a 4 MB module, so the phone can update the firmware over
; Bluetooth (OTA) and the bootloader can fall back to the old image if the new one never boots.
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
; version.py stamps companion/VERSION into the firmware as WL_VERSION (Arduino IDE builds say "dev")
extra_scripts = pre:version.py

; ESP32-S3 dev board, no modules. Two OTA slots like the classic build, so the phone can update it.
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
board_upload.flash_size = 4MB
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
extra_scripts = pre:version.py

; ---- Single-core RISC-V boards (Arduino core 3.x, via the pioarduino platform; the stock espressif32
; platform stops at core 2.x, which has no C5 / C6). Wi-Fi sniffing and the BLE scan share one core and one
; radio, so these hear a little less than a classic ESP32, but every one of them is a full Spotter.
; USB: Serial is the chip's own USB port (CDC on boot), the one a Scanner Pi talks to; on dev kits with two
; ports use the one marked USB.
[pioarduino]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip

; ESP32-C3 (C3 SuperMini, XIAO ESP32C3, C3-DevKitM-1): 2.4 GHz Wi-Fi + BLE 5.
[env:esp32c3]
platform = ${pioarduino.platform}
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
extra_scripts = pre:version.py
; one image fits every board of the family: 4 MB is the smallest flash these ship with, and min_spiffs
; (two 1.9 MB app slots) needs exactly that. A bigger flash just goes unused.
board_upload.flash_size = 4MB

; ESP32-C6 (C6-DevKitC-1, XIAO ESP32C6): 2.4 GHz Wi-Fi 6 + BLE 5.
[env:esp32c6]
extends = env:esp32c3
board = esp32-c6-devkitc-1

; ESP32-C5 (C5-DevKitC-1): the one board that also hears 5 GHz Wi-Fi (dual-band Wi-Fi 6) + BLE 5.
[env:esp32c5]
extends = env:esp32c3
board = esp32-c5-devkitc-1

; ESP32-S3 + SX1276 (e.g. a LoRa32 / Heltec-style board) with rtl_433 decoders on 433.92 MHz.
[env:esp32s3-subghz]
extends = env:esp32s3
lib_deps =
    ${env:esp32s3.lib_deps}
    https://github.com/NorthernMan54/rtl_433_ESP.git
    jgromes/RadioLib@^6.6.0
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    ${env:esp32s3.build_flags}
    -DHAS_SUBGHZ
    -DSUBGHZ_MHZ=433.92
    -DRF_SX1276
    -DRF_MODULE_RECEIVER_GPIO=32       ; DIO2 on the SX1276 → this ESP32 pin
    -DRF_MODULE_CS=18
    -DRF_MODULE_DIO0=26
    -DRF_MODULE_RST=14
    -DRF_MODULE_DIO1=35
    -DRF_MODULE_SCK=5
    -DRF_MODULE_MISO=19
    -DRF_MODULE_MOSI=27
    -DONBOARD_LED=25
    -DRTL_DEBUG=0

; Same with a CC1101: swap the flags.
[env:esp32s3-cc1101]
extends = env:esp32s3-subghz
build_flags =
    ${env:esp32s3.build_flags}
    -DHAS_SUBGHZ
    -DSUBGHZ_MHZ=433.92
    -DRF_CC1101
    -DRF_MODULE_RECEIVER_GPIO=4        ; GDO2
    -DRF_MODULE_CS=5
    -DRF_MODULE_GDO0=2
    -DRF_MODULE_SCK=18
    -DRF_MODULE_MISO=19
    -DRF_MODULE_MOSI=23
    -DRTL_DEBUG=0

; Full ESP32 companion: SX1276 sensors + spectrum sweep, and an SA818-U analog scanner for the Scanner tab.
; Classic ESP32 (WROOM-32U) — the SA818 audio path uses the ESP32's ADC1 pins (36 / 39); the S3 has no
; ADC on those pins, so move SA818U_AUDIO / SA818V_AUDIO to an ADC1 pin of your board if you build for it.
[env:esp32-full]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
    https://github.com/NorthernMan54/rtl_433_ESP.git
    jgromes/RadioLib@^6.6.0
    bblanchon/ArduinoJson@^7.0.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DHAS_SUBGHZ
    -DSUBGHZ_MHZ=433.92
    -DHAS_SPECTRUM
    -DSPEC_LO=410.0                   ; SX1276 433-MHz variant: 410–525 MHz; an 868/915 variant is 862–1020
    -DSPEC_HI=525.0
    -DHAS_SA818_U                      ; add -DHAS_SA818_V for a VHF module on the second UART
    -DRF_SX1276
    -DRF_MODULE_RECEIVER_GPIO=32
    -DRF_MODULE_CS=18
    -DRF_MODULE_DIO0=26
    -DRF_MODULE_RST=14
    -DRF_MODULE_DIO1=35
    -DRF_MODULE_SCK=5
    -DRF_MODULE_MISO=19
    -DRF_MODULE_MOSI=27
    -DRTL_DEBUG=0

; Scanner only: no sub-GHz chip, just an SA818-U (and/or -V). Arduino IDE can build this one too:
; uncomment HAS_SA818_U in the sketch.
[env:esp32-scanner]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.1.0
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DHAS_SA818_U
