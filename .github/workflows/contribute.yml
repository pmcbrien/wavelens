name: Merge contribution
on:
  issues:
    types: [opened, edited]
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  merge:
    if: contains(github.event.issue.labels.*.name, 'contribution')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Extract the pack from the issue
        id: pack
        env:
          BODY: ${{ github.event.issue.body }}
        run: |
          mkdir -p work
          # a dragged-in file becomes a github user-attachments link; a pasted pack sits in a code block
          URL=$(printf '%s' "$BODY" | grep -oE 'https://github\.com/user-attachments/files/[^) ]+' | head -1 || true)
          if [ -n "$URL" ]; then
            curl -sSL "$URL" -o work/pack.geojson
          else
            printf '%s' "$BODY" | awk '/^```/{f=!f; next} f' > work/pack.geojson
          fi
          [ -s work/pack.geojson ] || { echo "::error::no pack found in the issue"; exit 1; }
      - name: Validate and merge
        id: merge
        run: |
          python3 -I .github/scripts/validate_pack.py work/pack.geojson community/emitters.geojson community/merged.geojson | tee work/report.txt
          mv community/merged.geojson community/emitters.geojson
      - name: Open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          B="contrib/issue-$N"
          git config user.name "wavelens-bot"; git config user.email "wavelensapp@gmail.com"
          git checkout -B "$B"
          git add community/emitters.geojson
          git commit -m "Community map: contribution from #$N" || { echo "nothing new"; exit 0; }
          git push -f origin "$B"
          gh pr create --base main --head "$B" --title "Community map: contribution #$N" \
            --body "$(printf 'Closes #%s\n\n```\n%s\n```\n' "$N" "$(cat work/report.txt)")" || true
          gh issue comment "$N" --body "$(printf 'Validated. Report:\n```\n%s\n```\nA pull request has been opened for review.' "$(cat work/report.txt)")"
      - name: Report a rejection
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          N: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$N" --body "The pack could not be validated — see the workflow run for the reason. Common causes: a category that is not fixed infrastructure, coordinates finer than 3 decimals, or the file was not attached."
