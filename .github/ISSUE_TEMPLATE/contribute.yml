name: Contribute emitters
description: Share fixed cameras, plate readers and sensors from your Wavelens share pack
title: "Contribution: <your area>"
labels: ["contribution"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. In Wavelens go to **Setup → Community map → Preview share pack**, untick anything you don't want to share, **Export**, then drag the `.geojson` file into the box below.

        Only fixed infrastructure is accepted (ALPR / plate readers, traffic sensors, acoustic sensors), positions are rounded to ~100 m, and the file carries no addresses, trips or timestamps finer than a day. A bot validates the file and opens a pull request; the maintainer merges it into `community/emitters.geojson`.
  - type: input
    id: area
    attributes:
      label: Area
      description: Rough area the pack covers (city / county). No street addresses.
      placeholder: Pinellas County, FL
    validations:
      required: true
  - type: textarea
    id: pack
    attributes:
      label: Share pack
      description: Drag the exported .geojson file here (it becomes a link). You can also paste its contents in a code block.
      placeholder: Drop wavelens-share-YYYYMMDD.geojson here
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything you confirmed by eye — "the one on 4th St is a Flock on a pole", "the Genetec hit is a toll gantry".
  - type: checkboxes
    id: terms
    attributes:
      label: Licence
      options:
        - label: I contribute this data under CC0 (public domain) and it contains only fixed public infrastructure I observed myself.
          required: true
